apiVersion: v1
kind: Namespace
metadata:
  name: temporal-worker-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-worker
  namespace: temporal-worker-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-worker
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-worker
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: temporal-worker-lab:0.1.0
          imagePullPolicy: Never
          env:
            - name: TEMPORAL_ADDRESS
              value: host.lima.internal:7233
            - name: TEMPORAL_NAMESPACE
              value: temporal-worker-demo
            - name: TEMPORAL_TASK_QUEUE
              value: baseline-workers
            - name: GOMAXPROCS
              value: "1"
            - name: GOMEMLIMIT
              value: 24MiB
          ports:
            - name: health
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 24Mi
            limits:
              cpu: 150m
              memory: 64Mi
